const db = firebase.firestore();
const fbOn = () => !!firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('PEGA_AQUI') === -1;

async function cloudPush(){
  if(!fbOn()) return;
  try {
    S.ultimaSync = Date.now();
    // Copia limpia del estado (Firestore no acepta campos undefined)
    const estado = JSON.parse(JSON.stringify(S));
    const batch = db.batch();
    const fotosIds = [];
    estado.productos.forEach(p => {
      if(p.foto && p.foto.indexOf('data:') === 0){
        // Las fotos (base64) se guardan en documentos aparte para no superar
        // el límite de 1 MiB del documento principal
        batch.set(db.collection('pos').doc('fotos').collection('p').doc(String(p.id)), {foto: p.foto});
        fotosIds.push(String(p.id));
        p.foto = '';
      }
    });
    batch.set(db.collection('pos').doc('state'), {
      data: estado,
      fotos: fotosIds,
      updated_at: firebase.firestore.FieldValue.serverTimestamp()
    });
    await batch.commit();
    window.__lastCloudSync = Date.now();
  } catch(e){ console.warn('Error sincronizando con Firebase', e); }
}

let __cloudTimer = null;
function scheduleCloudSave(){
  if(!fbOn()) return;
  clearTimeout(__cloudTimer);
  __cloudTimer = setTimeout(cloudPush, 1200);
}

async function obtenerRemoto(){
  const doc = await db.collection('pos').doc('state').get();
  if(!doc.exists) return null;
  const rem = doc.data();
  if(!rem.data || !rem.data.productos) return null;
  // Reconstruir las fotos base64 desde sus documentos
  const fotosSnap = await db.collection('pos').doc('fotos').collection('p').get();
  const fotos = {};
  fotosSnap.forEach(fd => { fotos[fd.id] = fd.data().foto; });
  rem.data.productos.forEach(p => {
    if(!p.foto && fotos[String(p.id)]) p.foto = fotos[String(p.id)];
  });
  return {data: rem.data, remoteTime: rem.updated_at ? rem.updated_at.toMillis() : 0};
}

function aplicarRemoto(nuevo){
  ['productos','ventas','fiados','clientes','presupuestos','compras','cajas','auditoria','usuarios','metodos'].forEach(k => { if(!Array.isArray(nuevo[k])) nuevo[k] = []; });

  if(typeof nuevo.tasa !== 'number' || nuevo.tasa <= 0) nuevo.tasa = 842.2067;
  if(typeof nuevo.tasaParalela !== 'number') nuevo.tasaParalela = 0;
  if(!['bcv','paralela'].includes(nuevo.modoTasa)) nuevo.modoTasa = 'bcv';
  if(!Array.isArray(nuevo.historialTasas)) nuevo.historialTasas = [];
  if(nuevo.caja === undefined) nuevo.caja = null;
  if(!nuevo.negocio) nuevo.negocio = 'Tech Maxel';
  if(!nuevo.usuarios.some(u => u.nombre === 'JoseRGR')) nuevo.usuarios.push({nombre: 'JoseRGR', rol: 'admin', pin: 'Jr12598490'});
  if(!nuevo.usuarios.length) nuevo.usuarios = [{nombre: 'JoseRGR', rol: 'admin', pin: 'Jr12598490'}];
  if(!nuevo.usuarioActual || !nuevo.usuarios.some(u => u.nombre === nuevo.usuarioActual)) nuevo.usuarioActual = nuevo.usuarios[0].nombre;
  nuevo.productos.forEach(p => { if(!p.imeis) p.imeis = []; });
  S = nuevo;
  window.__lastCloudSync = Date.now();
  try { localStorage.setItem('pos_movil_v2', JSON.stringify(S)); } catch(e){}
  cart = [];
  return true;
}

async function cloudPull(){
  if(!fbOn()) return false;
  try {
    const rem = await obtenerRemoto();
    if(!rem) return false;
    const localTime = S.ultimaSync || 0;
    if(rem.remoteTime <= localTime + 1500) return false; // el dato local es igual o más reciente
    return aplicarRemoto(rem.data);
  } catch(e){ console.warn('Error leyendo de Firebase', e); return false; }
}

// Sincronización en tiempo real: si otro dispositivo guarda cambios, se aplican solos
function escucharCambiosNube(){
  if(!fbOn()) return;
  db.collection('pos').doc('state').onSnapshot(async () => {
    try {
      if(window.__lastCloudSync && Date.now() - window.__lastCloudSync < 5000) return;
      const rem = await obtenerRemoto();
      if(!rem) return;
      const localTime = S.ultimaSync || 0;
      if(rem.remoteTime <= localTime + 1500) return;
      if(aplicarRemoto(rem.data) && sessionStorage.getItem('pos_session_ok') === '1'){
        render();
        toast('☁️ Datos sincronizados desde la nube');
      }
    } catch(e){ console.warn('Error en el listener de Firebase', e); }
  }, e => console.warn('Error en el listener de Firebase', e));
}

  {g: 'Gestión', items: [['registro', '📋 Registro y Auditoría'], ['rep', '📊 Reportes'], ['metodos', '💳 Métodos de pago'], ['usuarios', '👤 Usuarios y permisos'], ['backup', '💾 Respaldo'], ['cfg', '⚙️ Configuración']]}
];

function buildSide(){
  let h = `<div class="brand">
    <img src="Gemini_Generated_Image_vlm9sbvlm9sbvlm9.jpg" alt="Logo Tech Maxel">
    <div>${esc(S.negocio)}<span>sistema de punto de venta</span></div>
  </div>`;
  NAV.forEach(g => {
    if(g.g === 'Gestión' && !isAdmin()) return;
    h += `<div class="ngroup">${g.g}</div>` + g.items.map(([v, l]) => `<button class="navb ${v === view ? 'on' : ''}" data-v="${v}">${l}</button>`).join('');
  });
  h += `<div class="userbox"><span class="mut">Usuario actual</span><select id="usel">${S.usuarios.map(u => `<option ${u.nombre === S.usuarioActual ? 'selected' : ''}>${esc(u.nombre)}</option>`).join('')}</select><button class="sbtn" id="logout" style="width:100%;margin-top:6px;padding:7px;font-size:12px">🔒 Cerrar sesión</button></div>`;
  $('#side').innerHTML = h;
  document.querySelectorAll('.navb').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  const lo = $('#logout');
  if(lo) lo.onclick = () => {
    sessionStorage.removeItem('pos_session_ok');
    registrarAuditoria('Cierre de Sesión', `El usuario ${S.usuarioActual} cerró sesión.`);
    location.reload();
  };
  
  $('#usel').onchange = e => {
    const nuevoUsuarioNombre = e.target.value;
    if (nuevoUsuarioNombre === S.usuarioActual) return;

    const admins = S.usuarios.filter(u => u.rol === 'admin' && u.pin);

    if (admins.length > 0) {
      const d = document.createElement('div');
      d.className = 'ovl';
      d.innerHTML = `
        <div class="mcard">
          <h2 style="margin-bottom:6px">🔒 Seguridad de Acceso</h2>
          <div class="mut" style="margin-bottom:14px">Para cambiar al usuario <b>${esc(nuevoUsuarioNombre)}</b>, ingrese el PIN del Administrador:</div>
          <input type="password" id="admin-pin" placeholder="PIN de administrador" style="width:100%;margin-bottom:14px" autofocus>
          <div class="row">
            <button class="pbtn" style="flex:1" id="btn-ok-pin">Confirmar</button>
            <button class="sbtn" id="btn-cancel-pin">Cancelar</button>
          </div>
        </div>`;
      document.body.appendChild(d);

      const cancelar = () => { d.remove(); buildSide(); };

      d.querySelector('#btn-cancel-pin').onclick = cancelar;
      d.querySelector('#btn-ok-pin').onclick = () => {
        const pinIngresado = d.querySelector('#admin-pin').value;
        const adminValido = admins.find(a => a.pin === pinIngresado);

        if (adminValido) {
          S.usuarioActual = nuevoUsuarioNombre;
          registrarAuditoria('Cambio de usuario', `Sesión cambiada a: ${S.usuarioActual} (Autorizado por admin: ${adminValido.nombre})`);
          save(); d.remove();
          view = isAdmin() ? view : 'pos'; 
          render();
          toast('✅ Cambio de usuario exitoso');
        } else {
          toast('❌ PIN de administrador incorrecto');
          d.querySelector('#admin-pin').value = '';
          d.querySelector('#admin-pin').focus();
        }
      };
      
      d.querySelector('#admin-pin').onkeydown = (ev) => {
        if (ev.key === 'Enter') d.querySelector('#btn-ok-pin').click();
      };
    } else {
      S.usuarioActual = nuevoUsuarioNombre;
      registrarAuditoria('Cambio de usuario', `Sesión cambiada a: ${S.usuarioActual}`);
      save(); view = isAdmin() ? view : 'pos'; render(); 
    }
  };
}

const cats = () => ['Todo', ...new Set(S.productos.map(p => p.cat))];
const total = () => cart.reduce((a, c) => a + c.precio * c.qty, 0);
const metodoPorClave = c => S.metodos.find(m => m.clave === c);

function render(){
  buildSide();
  const views = {
    pos: vPOS, precios: vPRECIOS, presup: vPRESUP, inv: vINV,
    compras: vCOMPRAS, clientes: vCLIENTES, caja: vCAJA, cobros: vCOBROS,
    registro: vREGISTRO, rep: vREP, metodos: vMETODOS, usuarios: vUSUARIOS, backup: vBACKUP, cfg: vCFG
  };
  if(views[view]) views[view]();
}

   <div class="mut" style="margin-bottom:14px">Elige el IMEI que se facturará para <b>${esc(p.nombre)}</b> (${disp.length} disponible${disp.length > 1 ? 's' : ''}):</div>

}

/* ============ SELECTOR DE MODELOS PARA FORROS ============ */
function parseModelos(str){
  if(!str) return [];
  const partes = String(str).split(/[,\n;]+/).flatMap(chunk => {
    const toks = chunk.trim().split(/\s+/).filter(Boolean);
    const out = []; let buf = [];
    const esNum = t => /^\d+$/.test(t);
    const esAlfaNum = t => /^[A-Za-z]+\d+$/.test(t) || /^\d+[A-Za-z]+$/.test(t);
    for(const t of toks){
      if(esNum(t)){
        if(buf.length){ out.push(buf.join(' ') + ' ' + t); buf = []; }
        else out.push(t);
      } else if(esAlfaNum(t)){
        if(buf.length){ out.push(buf.join(' ')); buf = []; }
        out.push(t);
      } else buf.push(t);
    }
    if(buf.length){
      if(out.length) out[out.length - 1] += ' ' + buf.join(' ');
      else out.push(buf.join(' '));
    }
    return out;
  }).map(s => s.trim()).filter(Boolean);
  return [...new Set(partes)];
}

const modelosDe = p => {
  if(Array.isArray(p.modelos) && p.modelos.length) return p.modelos;
  if(p.modelo) return parseModelos(p.modelo);
  return [];
};

function modeloPicker(p, cb){
  const modelos = modelosDe(p);
  if(!modelos.length){ cb(''); return; }
  const usados = m => cart.filter(c => c.id === p.id && c.modeloSel === m).reduce((a, c) => a + c.qty, 0);
  const d = document.createElement('div');
  d.className = 'ovl';
  d.innerHTML = `<div class="mcard"><h2 style="margin-bottom:4px">🎨 Seleccionar modelo del forro</h2>
   <div class="mut" style="margin-bottom:14px">Elige el modelo que se venderá de <b>${esc(p.nombre)}</b> (${modelos.length} modelo${modelos.length > 1 ? 's' : ''} disponible${modelos.length > 1 ? 's' : ''}):</div>
   <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${modelos.map((m, i) => {
     const u = usados(m);
     return `<button class="sbtn" data-m="${i}" style="text-align:left;font-weight:600;font-size:14px">📱 ${esc(m)}${u ? `<span class="tag blue" style="margin-left:8px">×${u} en esta venta</span>` : ''}</button>`;
   }).join('')}</div>
   <button class="sbtn" id="no" style="width:100%">Cancelar</button></div>`;
  document.body.appendChild(d);
  d.querySelector('#no').onclick = () => d.remove();
  d.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { d.remove(); cb(modelos[+b.dataset.m]); });
}

function addP(id){
  const p = S.productos.find(x => x.id === id);
  if(!p) return;
  if(p.stock <= 0){ toast('Sin stock: ' + p.nombre); return; }
  const esForro = (p.cat || '').toLowerCase().includes('forro');
  if(esForro && modelosDe(p).length){
    modeloPicker(p, (mod) => {
      const totEnCarrito = cart.filter(c => c.id === id).reduce((a, c) => a + c.qty, 0);
      const it = cart.find(c => c.id === id && c.modeloSel === mod);
      if(it){
        if(p.stock < 900 && it.qty >= p.stock){ toast('Stock máximo alcanzado'); return; }
        it.qty++;
      } else {
        if(p.stock < 900 && totEnCarrito >= p.stock){ toast('Stock máximo alcanzado'); return; }
        cart.push({id: p.id, nombre: p.nombre, precio: p.precio, qty: 1, modeloSel: mod});
      }
      vPOS();
    });
    return;
  }
  if(p.imeis && p.imeis.length){
    imeiPicker(p, (imei) => {
      const it = cart.find(c => c.id === id);
      if(it){
        if(p.stock < 900 && it.qty >= p.stock){ toast('Stock máximo alcanzado'); return; }
        it.qty++;
        it.imeis = it.imeis || [];
        it.imeis.push(imei);
      } else {
        cart.push({id: p.id, nombre: p.nombre, precio: p.precio, qty: 1, imeis: [imei]});
      }
      vPOS();
    });
    return;
  }
  const it = cart.find(c => c.id === id);
  if(it){
    if(p.stock < 900 && it.qty >= p.stock){ toast('Stock máximo alcanzado'); return; }
    it.qty++;
  } else {
    cart.push({id: p.id, nombre: p.nombre, precio: p.precio, qty: 1});
  }
  vPOS();
}

/* ============ MULTIPAGO (CON SOPORTE DE RECARGO %) ============ */
function payModal(){
  const baseTotal = total();
  const enPOS = () => S.metodos.filter(m => m.activo && m.enPOS).sort((a, b) => a.orden - b.orden);
  let lines = [{clave: 'efectivo_usd', monto: baseTotal, ref: '', casheaNivel: 'Nivel 1'}];
  const d = document.createElement('div');
  d.className = 'ovl';
  d.innerHTML = `<div class="mcard"><h2 style="margin-bottom:4px">Cobrar venta · multipago</h2>
   <div class="mut" style="margin-bottom:14px">Seleccione las opciones y complete los montos de pago.</div>
   
   <div class="card" style="background:var(--bg);padding:10px;margin-bottom:12px">
     <div style="font-weight:600;margin-bottom:8px;font-size:13px">Datos de Factura (Opcionales)</div>
     <div class="row" style="margin-bottom:6px">
       <input id="fac-nombre" placeholder="Nombre" style="flex:1">
       <input id="fac-apellido" placeholder="Apellido" style="flex:1">
     </div>
     <div class="row">
       <input id="fac-cedula" placeholder="Cédula / RIF" style="flex:1">
       <input id="fac-correo" placeholder="Correo electrónico" style="flex:1">
     </div>
   </div>
   <div style="margin-bottom:10px">
     <label style="font-size:13px;cursor:pointer"><input type="checkbox" id="fac-imprimir" checked> 🖨️ Imprimir factura al finalizar</label>
   </div>

   <div id="plines"></div>
   <button class="sbtn" id="addl" style="width:100%;margin-bottom:12px">+ Agregar otro método de pago</button>
   <div class="card" style="background:var(--bg);padding:12px;margin-bottom:14px">
    <div class="sumline"><span>Subtotal productos</span><b class="num" id="ssub"></b></div>
    <div class="sumline"><span>Recargos por método</span><b class="num" id="srecargo"></b></div>
    <div class="sumline"><span>Total con recargo</span><b class="num" id="stot" style="font-size:18px"></b></div>
    <div class="sumline"><span>Recibido (equivalente)</span><b class="num" id="srec"></b></div>
    <div class="sumline"><span style="color:var(--danger)">Faltante</span><b class="num" id="sfalt" style="color:var(--danger)"></b></div>
    <div class="sumline"><span style="color:var(--positive)">Vuelto al cliente</span><b class="num" id="svuel" style="color:var(--positive)"></b></div>
   </div>
   <div class="row"><button class="pbtn" style="flex:1" id="ok" disabled>✅ Confirmar cobro</button><button class="sbtn" id="no">Cancelar</button></div></div>`;
  document.body.appendChild(d);

  const toUsd = (monto, moneda) => moneda === 'Bs' ? monto / getTasaActual() : monto;
  
  function calc(){
    let noCash = 0, cashIn = 0, totalSurcharge = 0;
    
    lines.forEach(l => {
      const m = metodoPorClave(l.clave) || {moneda: 'USD', efectivo: false, recargoPct: 0};
      const usd = toUsd(+l.monto || 0, m.moneda);
      if(m.recargoPct > 0){
        totalSurcharge += usd * (m.recargoPct / 100);
      }
      if(m.efectivo) cashIn += usd; else noCash += usd;
    });

    const effectiveTotal = baseTotal + totalSurcharge;
    const rem = effectiveTotal - noCash, vuelto = Math.max(0, cashIn - rem), falt = Math.max(0, rem - cashIn);
    
    d.querySelector('#ssub').textContent = fU(baseTotal);
    d.querySelector('#srecargo').textContent = fU(totalSurcharge);
    d.querySelector('#stot').textContent = fU(effectiveTotal) + ' / ' + fV(effectiveTotal);
    d.querySelector('#srec').textContent = fU(noCash + cashIn);
    d.querySelector('#sfalt').textContent = fU(falt);
    d.querySelector('#svuel').textContent = fU(vuelto) + ' / ' + fV(vuelto);
    d.querySelector('#ok').disabled = falt > 0.005;
    return {vuelto, falt, effectiveTotal, totalSurcharge};
  }

  function drawLines(){
    d.querySelector('#plines').innerHTML = lines.map((l, i) => {
      const m = metodoPorClave(l.clave) || {moneda: 'USD', recargoPct: 0};
      const isCashea = (l.clave === 'cashea');
      return `<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border)">
       <div class="payline">
         <div>
           <select data-i="${i}" data-f="c" style="width:100%">${enPOS().map(mm => `<option value="${mm.clave}" ${mm.clave === l.clave ? 'selected' : ''}>${esc(mm.nombre)} (${mm.moneda})${mm.recargoPct ? ' [+' + mm.recargoPct + '%]' : ''}</option>`).join('')}</select>
         </div>
         <input type="number" min="0" step="0.01" data-i="${i}" data-f="m" value="${l.monto}" placeholder="Monto ${m.moneda}">
         ${m.pideRef && !isCashea ? `<input data-i="${i}" data-f="r" value="${esc(l.ref || '')}" placeholder="${m.banco ? 'Ref. + banco' : 'N° de referencia'}">` : '<span></span>'}
         <button class="ibtn" data-i="${i}" data-f="x" style="color:var(--danger)" ${lines.length > 1 ? '' : 'disabled'}>✕</button>
       </div>
       ${m.recargoPct > 0 ? `<div style="font-size:11px;color:var(--warn)">⚠️ Incluye recargo del ${m.recargoPct}% (+${fU(toUsd(+l.monto || 0, m.moneda) * (m.recargoPct/100))})</div>` : ''}
       ${isCashea ? `
         <div style="display:flex;align-items:center;gap:8px;padding-left:2px;font-size:13px;">
           <span style="color:var(--accent);font-weight:600;">📱 Nivel Cashea:</span>
           <select data-i="${i}" data-f="cashea-lvl" style="flex:1;padding:5px 8px;">
             <option value="Nivel 1" ${l.casheaNivel === 'Nivel 1' ? 'selected' : ''}>Nivel 1 (60% Inicial)</option>
             <option value="Nivel 2" ${l.casheaNivel === 'Nivel 2' ? 'selected' : ''}>Nivel 2 (50% Inicial)</option>
             <option value="Nivel 3" ${l.casheaNivel === 'Nivel 3' ? 'selected' : ''}>Nivel 3 (40% Inicial)</option>
             <option value="Nivel 4" ${l.casheaNivel === 'Nivel 4' ? 'selected' : ''}>Nivel 4 (40% Inicial / Promo)</option>
             <option value="Nivel 5" ${l.casheaNivel === 'Nivel 5' ? 'selected' : ''}>Nivel 5 (40% Inicial / Promo)</option>
             <option value="Nivel 6" ${l.casheaNivel === 'Nivel 6' ? 'selected' : ''}>Nivel 6 (0% a 40% Inicial)</option>
           </select>
           <input data-i="${i}" data-f="r" value="${esc(l.ref || '')}" placeholder="N° de referencia Cashea" style="flex:1;">
         </div>
       ` : ''}
      </div>`;
    }).join('');

    d.querySelectorAll('#plines [data-f]').forEach(el => {
      el.oninput = el.onchange = () => {
        const i = +el.dataset.i, fType = el.dataset.f;
        if(fType === 'c'){
          lines[i].clave = el.value;
          if(el.value === 'cashea' && !lines[i].casheaNivel) lines[i].casheaNivel = 'Nivel 1';
          const m = metodoPorClave(el.value);
          const resCalc = calc();
          if(m && !m.efectivo && +lines[i].monto <= 0) {
            lines[i].monto = (resCalc.falt * (m.moneda === 'Bs' ? getTasaActual() : 1)).toFixed(2);
          }
          drawLines();
        } else if(fType === 'm'){
          lines[i].monto = el.value;
        } else if(fType === 'cashea-lvl'){
          lines[i].casheaNivel = el.value;
        } else {
          lines[i].ref = el.value;
        }
        calc();
      };
    });
    d.querySelectorAll('#plines [data-f="x"]').forEach(b => b.onclick = () => { lines.splice(+b.dataset.i, 1); drawLines(); calc(); });
  }

  d.querySelector('#addl').onclick = () => {
    const ms = enPOS();
    const resCalc = calc();
    const m = ms.find(x => x.clave === 'efectivo_bs') || ms[0];
    lines.push({clave: m.clave, monto: (resCalc.falt * (m.moneda === 'Bs' ? getTasaActual() : 1)).toFixed(2), ref: '', casheaNivel: 'Nivel 1'});
    drawLines();
    calc();
  };

    finishSale({lineas, vueltoUsd: vuelto, totalFinal: effectiveTotal, clienteFactura: datosClienteFactura, imprimir});
    d.remove();
  };
  drawLines();
  calc();
}

    finishSale({lineas: [{metodo: 'Crédito', clave: 'credito', moneda: 'Bs', efectivo: false, monto: t * getTasaActual(), ref: '', recargoPct: 0}], vueltoUsd: 0, totalFinal: t, fiado: true});

function finishSale(pago){
  const t = pago.totalFinal !== undefined ? pago.totalFinal : total();
  const items = cart.map(c => ({...c}));
  items.forEach(c => {
    const p = S.productos.find(x => x.id === c.id);
    if(p){
      if(p.stock < 900) p.stock -= c.qty;
      if(c.imeis && c.imeis.length && p.imeis){
        p.imeis = p.imeis.filter(im => !c.imeis.includes(im));
      }
    }
  });
  const costo = items.reduce((a, c) => {
    const p = S.productos.find(x => x.id === c.id);
    return a + (p ? p.costo : 0) * c.qty;
  }, 0);
  S.ventas.push({f: Date.now(), items, total: t, costo, pago, user: S.usuarioActual});
  registrarAuditoria(pago.fiado ? 'Venta a Crédito (Fiado)' : 'Venta Completada', `Total: $${t.toFixed(2)}, Items: ${items.length}`);
  
  if(pago.imprimir){
    imprimirFacturaHTML({items, total: t, pago, fecha: Date.now()});
  }

  cart = []; save(); render();
  toast(pago.fiado ? '🤝 Fiado registrado: ' + fU(t) : '✅ Venta cobrada: ' + fU(t));
}

function comprimirImagen(file, cb, max = 360){
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc);
      c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => toast('❌ No se pudo leer la imagen');
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
}
function pickImage(cb, max = 360){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.position = 'fixed';
  inp.style.left = '-9999px';
  inp.style.opacity = '0';
  document.body.appendChild(inp);
  inp.onchange = () => {
    if(inp.files[0]) comprimirImagen(inp.files[0], url => { inp.remove(); cb(url); }, max);
    else inp.remove();
  };
  inp.click();
}

     <td class="acts" style="white-space:nowrap"><button class="ibtn" data-a="${p.id}" title="Ajustar +1">+1</button> <button class="ibtn" data-e="${p.id}" title="Editar">✏️</button> <button class="ibtn" data-r="${p.id}" title="Eliminar" style="color:var(--danger)">🗑</button></td></tr>`;
  }).join('')}</tbody></table></div>`;
  
  $('#nC').onchange = e => {$('#nCN').style.display = e.target.value === 'Nueva categoría...' ? 'block' : 'none'};
  let fotoData = '';
  const fotoInput = $('#nFoto');
  if(fotoInput) fotoInput.onchange = () => {
    const f = fotoInput.files[0];
    if(!f){ fotoData = ''; return; }
    comprimirImagen(f, url => {
      fotoData = url;
      const prev = $('#nFotoPrev');
      if(prev){ prev.src = url; prev.style.display = 'block'; }
      toast('📷 Foto cargada');
    });
  };
  $('#addP').onclick = () => {
    const n = $('#nN').value.trim();
    if(!n){ toast('Escribe el nombre'); return; }
    let c = $('#nC').value;
    if(c === 'Nueva categoría...') c = $('#nCN').value.trim() || 'General';
    
    const esForro = c.toLowerCase().includes('forro');
    const modelo = $('#nMod').value.trim();
    if(esForro && !modelo){
      toast('En la categoría Forros debes indicar el modelo (ej: A15, Redmi Note 13)');
      return;
    }
    if(esForro && S.productos.some(p =>
      p.cat.toLowerCase().includes('forro') &&
      p.nombre.toLowerCase() === n.toLowerCase() &&
      (p.modelo || '').toLowerCase() === modelo.toLowerCase()
    )){
      toast('⚠️ Ya existe un forro con ese nombre y modelo');
      return;
    }

    let rawImeis = $('#nImeis').value.trim();
    let imeisArr = rawImeis ? rawImeis.split(/[,\n]+/).map(x => x.trim()).filter(Boolean) : [];

    const agregarProducto = (foto) => {
      S.productos.push({
        id: Date.now(), 
        nombre: n, 
        cat: c, 
        precio: +$('#nP').value || 0, 
        costo: +$('#nK').value || 0, 
        stock: +$('#nS').value || (imeisArr.length > 0 ? imeisArr.length : 0), 
        imeis: imeisArr,
        modelo: modelo,
        modelos: esForro ? parseModelos(modelo) : [],
        det: $('#nD').value.trim(),
        foto: foto || ''
      });
      registrarAuditoria('Agregar Producto', `Producto: ${n}, Cat: ${c}, IMEIs: ${imeisArr.length}, Foto: ${foto ? 'sí' : 'no'}`);
      save(); vINV(); toast('✅ Producto agregado con éxito');
    };

    if(fotoData){
      agregarProducto(fotoData);
      fotoData = '';
    } else {
      agregarProducto('');
    }
  };
  $('#exp-catalogo').onclick = () => {
    const head = ['Producto','Categoría','Modelo / Detalle','Precio ($)','Precio (Bs)','Disponibilidad'];
    const filas = S.productos.map(p => {
      const detalle = [p.modelo, p.det].filter(Boolean).join(' · ');
      const disp = p.stock > 900 ? 'Servicio' : (p.stock > 0 ? 'Disponible' : 'Agotado');
      return [p.nombre || '', p.cat || '', detalle, (+p.precio || 0).toFixed(2), 'Bs ' + ((+p.precio || 0) * getTasaActual()).toFixed(2), disp];
    });
    const csv = [head, ...filas]
      .map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(','))
      .join('\n');
    const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    const f = new Date(), pad = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = `catalogo_${S.negocio.replace(/\s+/g, '_')}_${f.getFullYear()}-${pad(f.getMonth()+1)}-${pad(f.getDate())}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    registrarAuditoria('Exportar Catálogo Clientes', `Se exportó el catálogo de ${S.productos.length} productos para clientes (sin costos).`);
    toast('📄 Catálogo para clientes descargado');
  };

  main.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { 
    const p = S.productos.find(x => x.id == b.dataset.a);
    p.stock++; 
    registrarAuditoria('Ajuste Stock (+1)', `Producto: ${p.nombre}`);
    save(); vINV(); 
  });
  main.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const p = S.productos.find(x => x.id == b.dataset.r);
    if(confirm('¿Eliminar este producto?')){
      registrarAuditoria('Eliminar Producto', `Producto: ${p.nombre}`);
      S.productos = S.productos.filter(p => p.id != b.dataset.r);
      save(); vINV();
    }
  });
  main.querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
    const p = S.productos.find(x => x.id == b.dataset.e);
    if(!p) return;
    editarProductoModal(p);
  });
}

     <div style="flex:1"><label class="mut">Modelo (forros)</label><input id="ep-m" value="${esc(p.modelo || '')}" placeholder="Ej: A15, Redmi Note 13" style="width:100%;margin:4px 0 0"></div>

  document.body.appendChild(d);

  const prev = d.querySelector('#ep-prev');

    if(fotoTmp){ prev.src = fotoTmp; prev.style.display = 'block'; delBtn.style.display = 'block'; d.querySelector('#ep-foto').textContent = '📷 Cambiar foto'; }
    else { prev.removeAttribute('src'); prev.style.display = 'none'; delBtn.style.display = 'none'; d.querySelector('#ep-foto').textContent = '📷 Agregar foto'; }
  };

  d.querySelector('#ep-foto').onclick = () => {
    pickImage(url => { fotoTmp = url; actualizarVistaFoto(); toast('📷 Foto cargada (recuerda guardar los cambios)'); });
  };
  delBtn.onclick = () => { fotoTmp = ''; actualizarVistaFoto(); };
  d.querySelector('#ep-no').onclick = () => d.remove();

  d.querySelector('#ep-ok').onclick = () => {
    const n = d.querySelector('#ep-n').value.trim();
    if(!n){ toast('El nombre no puede estar vacío'); return; }

    p.nombre = n;
    p.precio = +d.querySelector('#ep-p').value || 0;
    p.costo = +d.querySelector('#ep-k').value || 0;

}

/* ============ COMPRAS ============ */
function vCOMPRAS(){
  main.innerHTML = `<h2>Compras a proveedores</h2><div class="hsub">Registra las compras: aumentan el stock y actualizan el costo del producto</div>
  <div class="card" style="margin-bottom:16px"><div class="row">
    <select id="cp" style="flex:2;min-width:180px">${S.productos.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>
    <input id="cc" type="number" min="1" placeholder="Cantidad" style="width:100px">
    <input id="ck" type="number" step="0.01" min="0" placeholder="Costo unitario $" style="width:140px">
    <input id="cx" placeholder="Proveedor (opcional)" style="width:160px">
    <button class="pbtn" id="okc">+ Registrar compra</button></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Historial de compras</b><span class="mut num">Total acumulado: ${fU(S.compras.reduce((a, c) => a + c.total, 0))}</span></div>
  ${S.compras.length ? S.compras.slice().reverse().map(c => {
    const dt = new Date(c.f);
    return `<div class="lrow"><div style="flex:1"><div style="font-weight:600">${esc(c.nombre)}</div>
    <div class="mut">${dt.toLocaleDateString()} · ${esc(c.prov || 'sin proveedor')} · ${c.cant} uds × ${fU(c.costo)}</div></div>
    <span class="num" style="font-weight:700">${fU(c.total)}</span>
    <button class="ibtn acts" data-dc="${c.id}" style="color:var(--danger)">🗑</button></div>`;
  }).join('') : '<div class="mut" style="padding:12px 0">Sin compras registradas.</div>'}</div>`;
  
  const sel = $('#cp');
  const autofill = () => { const p = S.productos.find(x => x.id == sel.value); if(p && !$('#ck').value) $('#ck').value = p.costo; };
  sel.onchange = autofill; autofill();
  
  $('#okc').onclick = () => {
    const p = S.productos.find(x => x.id == sel.value);
    if(!p) return;
    const cant = +$('#cc').value || 0, costo = +$('#ck').value || 0;
    if(cant <= 0 || costo < 0){ toast('Cantidad y costo inválidos'); return; }
    if(p.stock < 900) p.stock += cant;
    p.costo = costo;
    S.compras.push({id: Date.now(), f: Date.now(), pid: p.id, nombre: p.nombre, cant, costo, total: cant * costo, prov: $('#cx').value.trim()});
    registrarAuditoria('Registrar Compra', `Producto: ${p.nombre}, Cantidad: ${cant}, Total: $${(cant * costo).toFixed(2)}`);
    save(); vCOMPRAS(); toast('🛍️ Compra registrada: +' + cant + ' ' + p.nombre);
  };
  main.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => {
    if(confirm('¿Eliminar este registro? (no revierte el stock)')){
      S.compras = S.compras.filter(c => c.id != b.dataset.dc);
      save(); vCOMPRAS();
    }
  });
}

/* ============ CAJA ============ */
function vCAJA(){
  if(!S.caja){
    main.innerHTML = `<h2>Caja</h2><div class="hsub">Abre la caja para comenzar a vender con control de fondo</div>
    <div class="card" style="max-width:420px">
     <label class="mut">Fondo inicial en caja ($)</label>
     <input id="fd" type="number" min="0" step="0.01" value="100" style="width:100%;margin:4px 0 16px">
     <button class="pbtn" id="abrir">🔓 Abrir caja</button></div>`;
    $('#abrir').onclick = () => {
      const fondo = +$('#fd').value || 0;
      S.caja = {fondo: fondo, fApertura: Date.now(), movs: []};
      registrarAuditoria('Abrir Caja', `Fondo inicial: $${fondo.toFixed(2)}`);
      save(); vCAJA(); toast('🔓 Caja abierta');
    };
    return;
  }
  const desde = S.caja.fApertura;
  const vds = S.ventas.filter(v => v.f >= desde);
  const efectivoUsd = vds.reduce((a, v) => (v.pago.lineas || []).filter(l => l.efectivo).reduce((b, l) => b + (l.moneda === 'Bs' ? l.monto / getTasaActual() : l.monto), a), 0);
  const vuelto = vds.reduce((a, v) => a + (v.pago.vueltoUsd || 0), 0);
  const ins = S.caja.movs.filter(m => m.tipo === 'in').reduce((a, m) => a + (m.moneda === 'Bs' ? m.monto / getTasaActual() : m.monto), 0);
  const outs = S.caja.movs.filter(m => m.tipo === 'out').reduce((a, m) => a + (m.moneda === 'Bs' ? m.monto / getTasaActual() : m.monto), 0);
  const esperado = S.caja.fondo + efectivoUsd - vuelto + ins - outs;
  const dt = new Date(S.caja.fApertura);

  main.innerHTML = `<h2>Caja <span class="tag ok" style="vertical-align:middle">ABIERTA</span></h2>
  <div class="hsub">Abierta el ${dt.toLocaleDateString()} a las ${dt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</div>
  <div class="kpis">
   <div class="kpi"><div class="v num">${fU(S.caja.fondo)}</div><div class="l">Fondo inicial</div></div>
   <div class="kpi"><div class="v num">${fU(efectivoUsd - vuelto)}</div><div class="l">Ventas en efectivo netas</div></div>
   <div class="kpi"><div class="v num">${fU(ins - outs)}</div><div class="l">Movimientos manuales</div></div>
   <div class="kpi"><div class="v num" style="color:var(--accent)">${fU(esperado)}</div><div class="l">Efectivo esperado en caja</div></div>
  </div>
  <div class="row" style="align-items:flex-start;gap:16px">
   <div class="card" style="flex:1;min-width:280px"><b>Movimiento manual</b>
    <div class="row" style="margin-top:10px">
     <select id="mt"><option value="in">➡️ Entrada (ingresa dinero)</option><option value="out">⬅️ Salida (retira dinero)</option></select>
     <input id="mm" type="number" min="0" step="0.01" placeholder="Monto" style="width:110px">
     <select id="mo"><option value="USD">$ USD</option><option value="Bs">Bs</option></select></div>
    <input id="mx2" placeholder="Motivo (ej: pago de delivery)" style="width:100%;margin-top:8px">
    <button class="sbtn" id="am" style="margin-top:8px">Registrar movimiento</button></div>
   <div class="card" style="flex:1;min-width:280px"><b>Movimientos de la sesión</b>
    ${S.caja.movs.length ? S.caja.movs.slice().reverse().map(m => {
      const d2 = new Date(m.f);
      return `<div class="lrow"><span class="tag ${m.tipo === 'in' ? 'ok' : 'low'}">${m.tipo === 'in' ? 'entrada' : 'salida'}</span>
      <div style="flex:1"><div style="font-size:14px">${esc(m.motivo || '—')}</div><div class="mut">${d2.toLocaleDateString()}${d2.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</div></div>
      <span class="num" style="font-weight:700">${m.tipo === 'in' ? '+' : '−'}${fM(m.monto, m.moneda)}</span></div>`;
    }).join('') : '<div class="mut" style="padding:12px 0">Sin movimientos manuales.</div>'}</div>
  </div>
  <div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between">
   <div><b>Cerrar caja</b><div class="mut">Guarda la sesión con su resumen y vuelve a abrir con nuevo fondo</div></div>
   <button class="pbtn" id="cerrar" style="background:var(--danger)">🔒 Cerrar caja</button></div></div>`;
  
  $('#am').onclick = () => {
    const monto = +$('#mm').value || 0;
    const tipo = $('#mt').value;
    const motivo = $('#mx2').value.trim();
    const moneda = $('#mo').value;
    if(monto <= 0){ toast('Monto inválido'); return; }
    S.caja.movs.push({f: Date.now(), tipo, monto, moneda, motivo});
    registrarAuditoria(`Caja - Movimiento ${tipo}`, `Monto: ${fM(monto, moneda)}, Motivo: ${motivo}`);
    save(); vCAJA(); toast('💰 Movimiento registrado');
  };
  $('#cerrar').onclick = () => {
    S.cajas.push({fApertura: S.caja.fApertura, fCierre: Date.now(), fondo: S.caja.fondo, efectivoUsd, vuelto, ins, outs, esperado, ventas: vds.length});
    registrarAuditoria('Cierre de Caja', `Esperado en caja: $${esperado.toFixed(2)}`);
    S.caja = null; save(); view = 'rep'; render(); toast('🔒 Caja cerrada. Resumen en Reportes.');
  };
}

/* ============ COBROS ============ */
function vCOBROS(){
  const tot = S.fiados.reduce((a, f) => a + f.total - f.pagado, 0);
  main.innerHTML = `<h2>Cobros <span class="mut">· por cobrar <b class="num">${fU(tot)}</b></span></h2>
  <div class="hsub">Abonos y cancelación de fiados pendientes</div>
  <div class="card">${S.fiados.length ? S.fiados.map((f, i) => {
    const sal = f.total - f.pagado;
    return `<div class="lrow">
    <div style="flex:1"><div style="font-weight:600">${esc(f.cliente)}</div><div class="mut num">Total fiado ${fU(f.total)} · abonado ${fU(f.pagado)}</div></div>
    <span class="num" style="font-size:17px;font-weight:700;color:${sal > 0 ? 'var(--danger)' : 'var(--positive)'}">${fU(sal)}</span>${sal > 0 ? `<select id="fm${i}"><option value="USD">$</option><option value="Bs">Bs</option></select>
    <input type="number" min="0" step="0.01" placeholder="Abono" id="ab${i}" style="width:110px"><button class="sbtn" data-ab="${i}">Abonar</button>` : '<span class="tag ok">✔ Pagado</span>'}
    <button class="ibtn acts" data-df="${i}" style="color:var(--danger)">🗑</button></div>`;
  }).join('') : '<div class="mut" style="padding:16px 0">No hay fiados registrados.</div>'}</div>`;
  
  main.querySelectorAll('[data-ab]').forEach(b => b.onclick = () => {
    const i = +b.dataset.ab;
    const moneda = main.querySelector('#fm' + i).value;
    let m = +main.querySelector('#ab' + i).value || 0;
    if(m <= 0) return;
    const abonoUsd = moneda === 'Bs' ? m / getTasaActual() : m;
    S.fiados[i].pagado = Math.min(S.fiados[i].total, S.fiados[i].pagado + abonoUsd);
    registrarAuditoria('Abono de Fiado', `Cliente: ${S.fiados[i].cliente}, Abono: $${abonoUsd.toFixed(2)}`);
    save(); vCOBROS(); toast('💵 Abono registrado');
  });

    if(confirm('¿Eliminar este fiado?')){

      save(); vCOBROS();
    }
  });
}

/* ============ REPORTES ============ */
function vREP(){
  const hoy = new Date().toDateString();
  const vh = S.ventas.filter(v => new Date(v.f).toDateString() === hoy);
  const tv = vh.reduce((a, v) => a + v.total, 0), tc = vh.reduce((a, v) => a + v.costo, 0);
  const porMet = {};
  vh.forEach(v => (v.pago.lineas || []).forEach(l => {
    const usd = l.moneda === 'Bs' ? l.monto / getTasaActual() : l.monto;
    porMet[l.metodo] = (porMet[l.metodo] || 0) + usd;
  }));
  const dias = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
  const vd = dias.map(d => S.ventas.filter(v => new Date(v.f).toDateString() === d.toDateString()).reduce((a, v) => a + v.total, 0));
  const mx = Math.max(...vd, 1);
  const DN = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const W = 560, BH = 160, step = W / 7;
  const bars = vd.map((v, i) => {
    const h = Math.round(v / mx * (BH - 30));
    const x = i * step;
    return `<rect x="${x + step / 2 - 16}" y="${BH - h}" width="32" height="${h}" rx="6" fill="#0f6fde"/>
    <text x="${x + step / 2}" y="${BH - h - 6}" font-size="11" text-anchor="middle" fill="#555" font-weight="600">${v ? '$' + v.toFixed(0) : ''}</text>
    <text x="${x + step / 2}" y="${BH + 16}" font-size="11" text-anchor="middle" fill="#999">${DN[dias[i].getDay()]} ${dias[i].getDate()}</text>`;
  }).join('');

  main.innerHTML = `<h2>Reportes y cierre de caja</h2>
  <div class="row" style="margin-bottom:14px">
    <button class="sbtn danger" id="limpiar-log-rep">🗑 Limpiar Registro de Actividad</button>
    <button class="sbtn danger" id="limpiar-rep-caja">🧹 Limpiar Reportes y Cierres de Caja</button>
    <span class="mut">Vacía las ventas y los cierres de caja (requiere PIN de administrador)</span>
  </div>
  <div class="kpis">
   <div class="kpi"><div class="v num">${fU(tv)}</div><div class="l">Ventas de hoy</div></div>
   <div class="kpi"><div class="v num">${fU(tv - tc)}</div><div class="l">Ganancia neta de hoy</div></div>
   <div class="kpi"><div class="v num">${vh.length}</div><div class="l">Transacciones de hoy</div></div>
   <div class="kpi"><div class="v num">${fU(S.fiados.reduce((a, f) => a + f.total - f.pagado, 0))}</div><div class="l">Fiados por cobrar</div></div>
  </div>
  <div class="row" style="align-items:flex-start;gap:16px">
   <div class="card"><div class="mut" style="margin-bottom:8px">Ventas de los últimos 7 días ($)</div>
    <svg viewBox="0 0 ${W} ${BH + 24}" width="${W}" height="${BH + 24}">${bars}<line x1="0" y1="${BH}" x2="${W}" y2="${BH}" stroke="#e2e2e6"/></svg></div>
   <div class="card" style="flex:1;min-width:240px"><div class="mut" style="margin-bottom:8px">Cobros de hoy por método ($ eq.)</div>
    ${Object.keys(porMet).length ? Object.entries(porMet).sort((a, b) => b[1] - a[1]).map(([m, v]) => `<div class="lrow"><span style="flex:1">${esc(m)}</span><b class="num">${fU(v)}</b></div>`).join('') : '<div class="mut">Sin ventas hoy.</div>'}</div>
  </div>
  <div class="card" style="margin-top:16px"><div class="mut" style="margin-bottom:8px">Ventas recientes (con detalle de producto e IMEI)</div>
   ${S.ventas.slice(-10).reverse().map(v => {
     const dt = new Date(v.f);
     const met = (v.pago.lineas || []).map(l => esc(l.metodo) + (l.ref ? ' · ref ' + esc(l.ref) : '')).join(' + ');
     
     // Detalle de productos e IMEIs vendidos
     let itemsDetalleHtml = v.items.map(it => {
       let imeiInfo = it.imeis && it.imeis.length ? `<span style="color:var(--accent);font-size:11px;">[IMEI: ${esc(it.imeis.join(' · '))}]</span>` : '';
       let modeloInfo = it.modeloSel ? `<span style="color:var(--accent);font-size:11px;">[Modelo: ${esc(it.modeloSel)}]</span>` : '';
       return `<div style="font-size:13px;padding:2px 0;display:flex;justify-content:space-between;align-items:center;">
         <span>• <b>${it.qty}x</b> ${esc(it.nombre)}${imeiInfo}${modeloInfo}</span>
         <span class="num mut">${fU(it.precio * it.qty)}</span>
       </div>`;
     }).join('');

     return `<div class="lrow" style="align-items:flex-start;flex-direction:column;gap:6px;">
       <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
         <div style="font-size:14px;font-weight:600">Venta · ${met || '—'}</div>
         <span class="num" style="font-weight:700;font-size:16px">${fU(v.total)}</span>
       </div>
       <div style="width:100%;background:var(--bg);padding:8px 10px;border-radius:8px;">
         ${itemsDetalleHtml}
       </div>
       <div class="mut" style="width:100%;display:flex;justify-content:space-between;">
         <span>${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})} · Vendedor: <b>${esc(v.user || '')}</b></span>
         <span>Ganancia: <b class="num">${fU(v.total - v.costo)}</b></span>
       </div>
     </div>`;
   }).join('') || '<div class="mut">Sin ventas aún.</div>'}</div>
  ${S.cajas.length ? `<div class="card" style="margin-top:16px"><div class="mut" style="margin-bottom:8px">Cierres de caja anteriores</div>
   ${S.cajas.slice(-5).reverse().map(c => {
     const a = new Date(c.fApertura), b = new Date(c.fCierre);
     return `<div class="lrow"><div style="flex:1"><div style="font-size:14px;font-weight:600">${a.toLocaleDateString()} · ${a.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})} → ${b.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</div>
     <div class="mut num">${c.ventas} ventas · efectivo ${fU(c.efectivoUsd - c.vuelto)}</div></div>
     <span class="num" style="font-weight:700">${fU(c.esperado)} <span class="mut">en caja</span></span></div>`;
   }).join('')}</div>` : ''}`;

  $('#limpiar-log-rep').onclick = () => {
    const pin = prompt('Ingrese el PIN de administrador para vaciar el registro de actividad:');
    if(pin === null) return;
    const adminValido = S.usuarios.find(u => u.rol === 'admin' && u.pin && u.pin === pin);
    if(!adminValido){ toast('❌ PIN de administrador incorrecto'); return; }
    if(!confirm('¿Está seguro de vaciar TODO el registro de actividad? Esta acción no se puede deshacer.')) return;
    S.auditoria = [];
    registrarAuditoria('Limpiar Registro', `El registro de auditoría fue vaciado (autorizado por admin: ${adminValido.nombre}).`);
    save(); toast('🗑 Registro de actividad limpiado');
  };

  $('#limpiar-rep-caja').onclick = () => {
    // Seguridad: PIN de administrador obligatorio
    const pin = prompt('🔒 Ingrese el PIN de administrador para limpiar los reportes y cierres de caja:');
    if(pin === null) return;
    const adminValido = S.usuarios.find(u => u.rol === 'admin' && u.pin && u.pin === pin);
    if(!adminValido){ toast('❌ PIN de administrador incorrecto'); return; }
    if(!confirm('⚠️ Esto eliminará TODAS las ventas registradas y TODOS los cierres de caja anteriores.\n\nEsta acción NO se puede deshacer.\n\n¿Desea continuar?')) return;

    const numVentas = S.ventas.length;
    const numCierres = S.cajas.length;
    S.ventas = [];
    S.cajas = [];
    cart = [];
    registrarAuditoria('Limpiar Reportes y Cierre de Caja', `Se eliminaron ${numVentas} ventas y ${numCierres} cierres de caja (autorizado por admin: ${adminValido.nombre}).`);
    save();
    vREP();
    toast('🧹 Reportes y cierres de caja limpiados');
  };
}

function vMETODOS(){

  const list = [...S.metodos].sort((a, b) => a.orden - b.orden);

  <div class="hsub">Configuración de los métodos de pago disponibles en el sistema (puedes agregar % de recargo).</div>

   <th>Orden</th><th>Método</th><th>Clave</th><th>Moneda</th><th>Recargo %</th><th>Pide ref.</th><th>Efectivo</th><th>En POS</th><th>Cobros</th><th>Estado</th><th style="width:80px">Acciones</th></tr></thead>
  <tbody>${list.map(m => `<tr>
   <td class="num">${m.orden}</td>

   <td>${m.pideRef ? (m.banco ? '✓ + banco' : '✓') : '—'}</td>
   <td>${m.efectivo ? '✓' : '—'}</td>
   <td>${m.enPOS ? '✓' : '—'}</td>
   <td class="num">${uso(m.clave)}</td>
   <td><button class="tag ${m.activo ? 'ok' : 'off'}" data-tg="${esc(m.clave)}" style="border:0;cursor:pointer">${m.activo ? 'ACTIVO' : 'INACTIVO'}</button></td>
   <td class="acts" style="white-space:nowrap"><button class="ibtn" data-em="${esc(m.clave)}">✏️</button> <button class="ibtn" data-dm="${esc(m.clave)}" style="color:var(--danger)">🗑</button></td></tr>`).join('')}</tbody></table></div>`;
  
  $('#nm').onclick = () => metodoModal(null);

    registrarAuditoria('Cambiar Estado Método Pago', `Método: ${m.nombre}, Estado: ${m.activo ? 'Activo' : 'Inactivo'}`);
    save(); vMETODOS(); 
  });
  main.querySelectorAll('[data-em]').forEach(b => b.onclick = () => metodoModal(metodoPorClave(b.dataset.em)));
  main.querySelectorAll('[data-dm]').forEach(b => b.onclick = () => {
    const claveMetodo = b.dataset.dm;
    const metodoObj = metodoPorClave(claveMetodo);
    if(confirm(`¿Está seguro de eliminar el método de pago "${metodoObj ? metodoObj.name || metodoObj.nombre : claveMetodo}"?`)){
      registrarAuditoria('Eliminar Método Pago', `Clave: ${claveMetodo}`);
      S.metodos = S.metodos.filter(m => m.clave !== claveMetodo);
      save(); vMETODOS(); toast('🗑 Método de pago eliminado');
    }
  });
}

function metodoModal(m){
  const isNew = !m;
  m = m || {orden: (Math.max(...S.metodos.map(x => x.orden)) + 10), nombre: '', clave: '', moneda: 'Bs', pideRef: false, banco: false, efectivo: false, enPOS: true, activo: true, recargoPct: 0};
  if(m.recargoPct === undefined) m.recargoPct = 0;
  const d = document.createElement('div');
  d.className = 'ovl';
  d.innerHTML = `<div class="mcard"><h2 style="margin-bottom:16px">${isNew ? 'Nuevo método de pago' : 'Editar método de pago'}</h2>
   <label class="mut">Nombre</label><input id="mn" value="${esc(m.nombre)}" placeholder="ej: Tarjeta Internacional" style="width:100%;margin:4px 0 10px">
   <label class="mut">Clave (sin espacios)</label><input id="mc" value="${esc(m.clave)}" placeholder="ej: tarjeta_int" style="width:100%;margin:4px 0 10px" ${m.fab ? 'disabled' : ''}>
   <div class="row" style="margin-bottom:10px">
    <div><label class="mut">Moneda</label><select id="mm2" style="width:100px"><option value="Bs" ${m.moneda === 'Bs' ? 'selected' : ''}>Bs</option><option value="USD" ${m.moneda === 'USD' ? 'selected' : ''}>$ USD</option></select></div>
    <div><label class="mut">Orden</label><input id="mo2" type="number" value="${m.orden}" style="width:80px"></div>
    <div><label class="mut">Recargo (%)</label><input id="mrec" type="number" step="0.01" min="0" value="${m.recargoPct}" style="width:90px" placeholder="0"></div>
   </div>
   <div class="row" style="margin-bottom:14px">
    <label style="font-size:13px"><input type="checkbox" id="cp1" ${m.pideRef ? 'checked' : ''}> Pide referencia</label>
    <label style="font-size:13px" id="cbank" class="${m.pideRef ? '' : 'mut'}"><input type="checkbox" id="cp2" ${m.banco ? 'checked' : ''}> Incluye banco</label>
    <label style="font-size:13px"><input type="checkbox" id="cp3" ${m.efectivo ? 'checked' : ''}> Es efectivo</label>
    <label style="font-size:13px"><input type="checkbox" id="cp4" ${m.enPOS ? 'checked' : ''}> Visible en POS</label></div>
   <div class="row"><button class="pbtn" style="flex:1" id="ok">Guardar</button><button class="sbtn" id="no">Cancelar</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#cp1').onchange = e => d.querySelector('#cbank').className = e.target.checked ? '' : 'mut';
  d.querySelector('#no').onclick = () => d.remove();
  d.querySelector('#ok').onclick = () => {
    const nombre = d.querySelector('#mn').value.trim();
    const clave = (m.fab ? m.clave : d.querySelector('#mc').value.trim().toLowerCase().replace(/\s+/g, '_'));
    if(!nombre || !clave){ toast('Nombre y clave son obligatorios'); return; }
    if(isNew && metodoPorClave(clave)){ toast('Esa clave ya existe'); return; }
    m.nombre = nombre; if(!m.fab) m.clave = clave;
    m.moneda = d.querySelector('#mm2').value; m.orden = +d.querySelector('#mo2').value || m.orden;
    m.recargoPct = +d.querySelector('#mrec').value || 0;
    m.pideRef = d.querySelector('#cp1').checked; m.banco = d.querySelector('#cp2').checked && m.pideRef;
    m.efectivo = d.querySelector('#cp3').checked; m.enPOS = d.querySelector('#cp4').checked;
    if(isNew) S.metodos.push(m);
    registrarAuditoria(isNew ? 'Crear Método Pago' : 'Editar Método Pago', `Método: ${nombre}, Recargo: ${m.recargoPct}%`);
    save(); d.remove(); vMETODOS(); toast('💾 Método guardado');
  };
}

    <h3 style="font-size:15px;margin-bottom:8px">📥 Exportar respaldo</h3>
    <div class="mut" style="margin-bottom:12px">Genera un archivo <b>.json</b> con la información completa del sistema para guardarlo en USB, correo, PC o la nube. También puedes exportar el inventario en <b>.csv</b> (abre en Excel).</div>
    ${S.ultimoRespaldo ? `<div class="mut" style="margin-bottom:10px">Último respaldo exportado: <b>${new Date(S.ultimoRespaldo.f).toLocaleString()}</b> por ${esc(S.ultimoRespaldo.usuario)}</div>` : '<div class="mut" style="margin-bottom:10px">Aún no se ha exportado ningún respaldo desde esta pantalla.</div>'}
    <div class="row">
      <button class="pbtn" id="exp-full">📥 Exportar respaldo completo (.json)</button>
      <button class="sbtn" id="exp-clip">📋 Copiar al portapapeles</button>
      <button class="sbtn" id="exp-csv">📄 Exportar inventario (.csv)</button>
    </div>
   </div>
   <div class="card" style="flex:1;min-width:300px">
    <h3 style="font-size:15px;margin-bottom:8px">📤 Importar / Restaurar respaldo</h3>
    <div class="mut" style="margin-bottom:12px">Carga un archivo <b>.json</b> generado previamente con "Exportar respaldo completo". <b style="color:var(--danger)">⚠️ Reemplaza TODA la información actual del sistema</b> (inventario, ventas, caja, usuarios, auditoría, configuración). Requiere PIN de administrador.</div>
    <div class="row">
      <input type="file" id="imp-file" accept=".json,application/json" style="flex:1">
      <button class="pbtn" id="imp-btn" style="background:var(--danger)">📤 Restaurar respaldo</button>
    </div>
   </div>
  </div>
  <div class="card" style="margin-top:16px">
   <div class="mut">💡 <b>Consejo:</b> exporta un respaldo al final de cada día o antes de hacer cambios importantes. El archivo .json incluye absolutamente todo el sistema (configuración, logo incluido); si cambias de PC o navegador, solo necesitas este archivo para recuperar todo.</div>
  </div>`;

  const buildBackup = () => JSON.stringify({
    app: 'Tech Maxel POS',
    version: 5,
    f: new Date().toISOString(),
    negocio: S.negocio,
    respaldo: S
  }, null, 2);

  const descargar = (contenido, nombre, tipo) => {
    const blob = new Blob([contenido], {type: tipo});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const nombreFecha = (ext) => {
    const f = new Date(), pad = n => String(n).padStart(2, '0');
    return `techmaxel_${f.getFullYear()}-${pad(f.getMonth()+1)}-${pad(f.getDate())}_${pad(f.getHours())}-${pad(f.getMinutes())}.${ext}`;
  };

  const syncBtn = $('#sync-now');
  if(syncBtn) syncBtn.onclick = async () => {
    toast('🔄 Sincronizando con la nube...');
    await cloudPush();
    toast('☁️ Sincronizado');
    vBACKUP();
  };

  $('#exp-full').onclick = () => {
    descargar(buildBackup(), nombreFecha('json'), 'application/json');
    S.ultimoRespaldo = {f: Date.now(), usuario: S.usuarioActual};
    registrarAuditoria('Exportar Respaldo', 'Se exportó un respaldo completo del sistema (.json)');
    vBACKUP();
    toast('📥 Respaldo descargado');
  };

  $('#exp-clip').onclick = async () => {
    try {
      await navigator.clipboard.writeText(buildBackup());
      S.ultimoRespaldo = {f: Date.now(), usuario: S.usuarioActual};
      registrarAuditoria('Exportar Respaldo', 'Respaldo completo copiado al portapapeles');
      toast('📋 Respaldo copiado al portapapeles');
    } catch(e) {
      toast('❌ No se pudo copiar al portapapeles; usa la descarga .json');
    }
  };

  $('#exp-csv').onclick = () => {
    const head = ['ID','Nombre','Categoría','Modelo','Modelos (forros)','Precio USD','Costo USD','Stock','IMEIs','Detalle'];
    const filas = S.productos.map(p => [
      p.id, p.nombre || '', p.cat || '', p.modelo || '', (p.modelos || []).join(' | '),
      p.precio, p.costo, p.stock, (p.imeis || []).join(' | '), p.det || ''
    ]);
    const csv = [head, ...filas]
      .map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(','))
      .join('\n');
    descargar('\uFEFF' + csv, nombreFecha('csv'), 'text/csv;charset=utf-8');
    registrarAuditoria('Exportar Inventario CSV', `Se exportaron ${S.productos.length} productos a CSV.`);
    toast('📄 Inventario exportado a CSV');
  };

  $('#imp-btn').onclick = () => {
    const file = $('#imp-file').files[0];
    if(!file){ toast('Selecciona un archivo .json primero'); return; }
    const r = new FileReader();
    r.onload = ev => {
      let data;
      try { data = JSON.parse(ev.target.result); }
      catch(e){ toast('❌ Archivo inválido: no es un JSON válido'); return; }
      const nuevo = (data && data.respaldo) ? data.respaldo : data;
      if(!nuevo || !Array.isArray(nuevo.productos) || !Array.isArray(nuevo.ventas)){
        toast('❌ El archivo no parece ser un respaldo de Tech Maxel POS');
        return;
      }
      // Seguridad: PIN de administrador obligatorio para restaurar
      const admins = S.usuarios.filter(u => u.rol === 'admin' && u.pin);
      if(admins.length){
        const pin = prompt('🔒 Ingrese el PIN de administrador para restaurar el respaldo:');
        if(pin === null) return;
        if(!admins.find(a => a.pin === pin)){ toast('❌ PIN de administrador incorrecto'); return; }
      }
      const origen = data.f ? new Date(data.f).toLocaleString() : 'archivo seleccionado';
      if(!confirm('⚠️ Esto REEMPLAZARÁ toda la información actual del sistema (inventario, ventas, caja, usuarios, auditoría y configuración) por la del respaldo del ' + origen + '.\n\n¿Está seguro de continuar?')) return;

      // Normalizar campos mínimos para que el sistema quede consistente
      ['ventas','fiados','clientes','presupuestos','compras','cajas','auditoria','usuarios','metodos'].forEach(k => { if(!Array.isArray(nuevo[k])) nuevo[k] = []; });
      if(!nuevo.facturaCfg) nuevo.facturaCfg = {encabezado:'', pie:'¡Gracias por su compra! Conserve su factura', mostrarDatosNegocio:true, mostrarVendedor:true, mostrarTasa:false, usarCorrelativo:true, correlativo:1};
      if(typeof nuevo.tasa !== 'number' || nuevo.tasa <= 0) nuevo.tasa = 842.2067;
      if(typeof nuevo.tasaParalela !== 'number') nuevo.tasaParalela = 0;
      if(!['bcv','paralela'].includes(nuevo.modoTasa)) nuevo.modoTasa = 'bcv';
      if(!Array.isArray(nuevo.historialTasas)) nuevo.historialTasas = [];
      if(nuevo.caja === undefined) nuevo.caja = null;
      if(!nuevo.negocio) nuevo.negocio = 'Tech Maxel';
      if(!nuevo.usuarios.length) nuevo.usuarios = [{nombre: 'Dueño', rol: 'admin', pin: '1234'}];
      if(!nuevo.usuarioActual || !nuevo.usuarios.some(u => u.nombre === nuevo.usuarioActual)) nuevo.usuarioActual = nuevo.usuarios[0].nombre;

      nuevo.ultimoRespaldo = {f: Date.now(), usuario: 'Restaurado (antes: ' + S.usuarioActual + ')'};
      S = nuevo;
      cart = [];
      registrarAuditoria('Restaurar Respaldo', 'Se importó y restauró el respaldo generado el ' + origen);
      save();
      view = isAdmin() ? 'backup' : 'pos';
      render();
      toast('✅ Respaldo restaurado correctamente');
    };
    r.readAsText(file);
  };
}

/* ============ CONFIGURACIÓN ============ */
function vCFG(){
  main.innerHTML = `<h2>Configuración</h2>
  <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
   <div class="card" style="flex:1;min-width:300px;max-width:500px">
    <h3 style="font-size:15px;margin-bottom:12px">Datos Generales</h3>
    <label class="mut">Nombre del negocio</label>
    <input id="nb" value="${esc(S.negocio)}" style="width:100%;margin:4px 0 12px">
    <label class="mut">RIF</label>
    <input id="rf" value="${esc(S.rif || '')}" placeholder="Ej: V-1234567-8" style="width:100%;margin:4px 0 12px">
    <label class="mut">Dirección</label>
    <input id="dr" value="${esc(S.direccion || '')}" placeholder="Ej: Acarigua - Portuguesa" style="width:100%;margin:4px 0 12px">
    <label class="mut">Teléfonos</label>
    <input id="tl" value="${esc(S.telefonos || '')}" placeholder="Ej: 04145502031" style="width:100%;margin:4px 0 12px">
    <button class="pbtn" id="sv-gen" style="margin-top:4px">💾 Guardar Datos Generales</button>
   </div>

   <div style="flex:1;min-width:300px;display:flex;flex-direction:column;gap:16px">
    <div class="card">
     <h3 style="font-size:15px;margin-bottom:12px">Gestión de Tasas (BCV / Paralela)</h3>
     <label class="mut">TASA PARALELA (BS/$)</label>
     <input id="tpar" type="number" step="0.0001" min="0" value="${S.tasaParalela}" style="width:100%;margin:4px 0 10px">
     <div class="mut" style="margin-bottom:6px">MODO DE PRECIO PARA CLIENTES</div>
     <div class="row" style="margin-bottom:14px">
      <button class="sbtn ${S.modoTasa === 'bcv' ? 'on' : ''}" id="btn-bcv" style="flex:1">🇻🇪 USAR TASA BCV <span style="display:block;font-size:11px;font-weight:400">SISTEMA NORMAL</span></button>
      <button class="sbtn ${S.modoTasa === 'paralela' ? 'on' : ''}" id="btn-par" style="flex:1">PARALELA <span style="display:block;font-size:11px;font-weight:400">PRECIOS INFLADOS</span></button>
     </div>
     <button class="pbtn" id="sv-tpar" style="width:100%">💾 GUARDAR TASA PARALELA</button>
    </div>

    <div class="card">
     <h3 style="font-size:15px;margin-bottom:10px">Tasa BCV del Día</h3>
     <div style="font-size:24px;font-weight:800;color:var(--accent);margin-bottom:2px" class="num">${S.tasa.toFixed(4)}</div>
     <div class="mut" style="margin-bottom:12px">FACTOR BCV — ${new Date().toLocaleDateString()}</div>
     <button class="sbtn" id="btn-fetch-bcv" style="width:100%;margin-bottom:12px">⚡ OBTENER Y GUARDAR TASA BCV</button>
     <label class="mut">INGRESAR MANUALMENTE (RESPALDO)</label>
     <div class="row" style="margin-top:4px">
      <input id="tman" type="number" step="0.0001" placeholder="Ej: 476.5021" style="flex:1">
      <button class="pbtn" id="sv-tman">GUARDAR</button>
     </div>
    </div>
   </div>
  </div>

  <div class="card" style="margin-top:16px">
   <h3 style="font-size:15px;margin-bottom:10px">Historial de Tasas</h3>
   <table class="tbl">
    <thead><tr><th>Fecha</th><th>Factor</th><th>Usuario</th></tr></thead>
    <tbody>
     ${S.historialTasas && S.historialTasas.length ? S.historialTasas.map(ht => `<tr>
      <td class="num">${esc(ht.f)}</td>
      <td class="num" style="font-weight:700">${Number(ht.factor).toFixed(4)}</td>
      <td class="mut">${esc(ht.usuario)}</td>
     </tr>`).join('') : '<tr><td colspan="3" class="mut">Sin historial registrado.</td></tr>'}
    </tbody>
   </table>
  </div>

  <div class="card" style="margin-top:16px;max-width:500px">
   <h3 style="font-size:15px;margin-bottom:12px">🖨️ Configuración de la Factura Impresa</h3>
   <label class="mut">Logo del negocio (aparece arriba en la factura)</label>
   <div class="row" style="margin:4px 0 10px">
     <input type="file" id="fc-logo" accept="image/*" style="flex:1">
     ${S.facturaCfg.logo ? `<button class="sbtn danger" id="fc-logo-del">🗑 Quitar logo</button>` : ''}
   </div>
   ${S.facturaCfg.logo ? `<div style="margin-bottom:10px"><img src="${S.facturaCfg.logo}" style="width:60px;height:60px;object-fit:contain;border:1px solid var(--border);border-radius:8px;padding:4px"></div>` : ''}
   <label class="mut">Encabezado personalizado</label>
   <textarea id="fc-enc" placeholder="Ej: ¡Gracias por preferirnos!" style="width:100%;height:60px;margin:4px 0 10px">${esc(S.facturaCfg.encabezado || '')}</textarea>
   <label class="mut">Pie de página</label>
   <input id="fc-pie" value="${esc(S.facturaCfg.pie || '')}" style="width:100%;margin:4px 0 10px">
   <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
     <label style="font-size:13px"><input type="checkbox" id="fc-neg" ${S.facturaCfg.mostrarDatosNegocio !== false ? 'checked' : ''}> Mostrar RIF y dirección del negocio</label>
     <label style="font-size:13px"><input type="checkbox" id="fc-ven" ${S.facturaCfg.mostrarVendedor !== false ? 'checked' : ''}> Mostrar nombre del vendedor</label>
     <label style="font-size:13px"><input type="checkbox" id="fc-tas" ${S.facturaCfg.mostrarTasa ? 'checked' : ''}> Mostrar tasa del día en factura</label>
     <label style="font-size:13px"><input type="checkbox" id="fc-cor" ${S.facturaCfg.usarCorrelativo !== false ? 'checked' : ''}> Usar número correlativo de factura</label>
   </div>
   <div class="row">
     <button class="pbtn" id="sv-fc" style="flex:1">💾 Guardar Configuración de Factura</button>
     <button class="sbtn" id="fc-prev">👁️ Vista previa</button>
   </div>
  </div>`;

  $('#sv-gen').onclick = () => {
    S.negocio = $('#nb').value.trim() || 'Tech Maxel';
    S.rif = $('#rf').value.trim();
    S.direccion = $('#dr').value.trim();
    S.telefonos = $('#tl').value.trim();
    registrarAuditoria('Actualizar Configuración', 'Se actualizaron los datos generales del negocio.');
    save(); buildSide(); toast('💾 Datos generales guardados');
  };

  $('#btn-bcv').onclick = () => { S.modoTasa = 'bcv'; registrarAuditoria('Modo Tasa', 'Cambiado a Tasa BCV'); save(); vCFG(); toast('🇻🇪 Modo Tasa BCV activado'); };
  $('#btn-par').onclick = () => { S.modoTasa = 'paralela'; registrarAuditoria('Modo Tasa', 'Cambiado a Tasa Paralela'); save(); vCFG(); toast('💱 Modo Tasa Paralela activado'); };
  
  $('#sv-tpar').onclick = () => {
    const tp = +$('#tpar').value || 0;
    S.tasaParalela = tp;
    registrarAuditoria('Actualizar Tasa Paralela', `Nueva tasa paralela: ${tp}`);
    save(); vCFG(); toast('💾 Tasa paralela guardada');
  };

  $('#sv-tman').onclick = () => {
    const tm = +$('#tman').value || 0;
    if(tm <= 0){ toast('Ingresa una tasa válida'); return; }
    S.tasa = tm;
    S.historialTasas.unshift({f: new Date().toISOString().split('T')[0], factor: tm, usuario: S.usuarioActual});
    if(S.historialTasas.length > 30) S.historialTasas.pop();
    registrarAuditoria('Actualizar Tasa Manual', `Tasa BCV manual: ${tm}`);
    save(); vCFG(); toast('💾 Tasa BCV actualizada manualmente');
  };

  $('#btn-fetch-bcv').onclick = async () => {
    toast('Consultando tasa BCV...');
    try {
      const res = await fetch('https://ve.dolarapi.com/v1/dolares/bcv');
      const data = await res.json();
      if(data && data.promedio){
        S.tasa = +data.promedio;
        S.historialTasas.unshift({f: new Date().toISOString().split('T')[0], factor: S.tasa, usuario: S.usuarioActual});
        if(S.historialTasas.length > 30) S.historialTasas.pop();
        registrarAuditoria('Actualizar Tasa API', `Tasa BCV obtenida: ${S.tasa}`);
        save(); vCFG(); toast('⚡ Tasa BCV actualizada: ' + S.tasa.toFixed(4));
      } else {
        throw new Error('Formato inválido');
      }
    } catch(e) {
      toast('❌ No se pudo conectar con DolarAPI. Usa la entrada manual.');
    }
  };

  $('#sv-fc').onclick = () => {
    S.facturaCfg = {
      encabezado: $('#fc-enc').value.trim(),
      pie: $('#fc-pie').value.trim(),
      mostrarDatosNegocio: $('#fc-neg').checked,
      mostrarVendedor: $('#fc-ven').checked,
      mostrarTasa: $('#fc-tas').checked,
      usarCorrelativo: $('#fc-cor').checked,
      correlativo: S.facturaCfg.correlativo || 1
    };
    registrarAuditoria('Configurar Factura', 'Se actualizó la configuración de la factura impresa.');
    save(); toast('💾 Configuración de factura guardada');
  };

  const logoInput = $('#fc-logo');
  if(logoInput){
    logoInput.onchange = e => {
      const file = e.target.files[0];
      if(!file) return;
      const r = new FileReader();
      r.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const max = 220;
          const sc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * sc);
          c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          S.facturaCfg.logo = c.toDataURL('image/png');
          registrarAuditoria('Cambiar Logo Factura', 'Se actualizó el logo de la factura.');
          save(); vCFG(); toast('🖼️ Logo guardado');
        };
        img.src = ev.target.result;
      };
      r.readAsDataURL(file);
    };
  }
  const delLogo = $('#fc-logo-del');
  if(delLogo){
    delLogo.onclick = () => {
      S.facturaCfg.logo = '';
      registrarAuditoria('Quitar Logo Factura', 'Se eliminó el logo de la factura.');
      save(); vCFG(); toast('🗑 Logo eliminado');
    };
  }
  $('#fc-prev').onclick = () => {
    imprimirFacturaHTML({
      items: [{nombre: 'Producto de ejemplo', precio: 10, qty: 2, imeis: []}],
      total: 20,
      pago: {lineas: [{metodo: 'Efectivo $', moneda: 'USD', monto: 20, ref: ''}], vueltoUsd: 0},
      fecha: Date.now()
    }, true);
  };
}

(async () => {
  const huboCambios = await cloudPull();
  if(sessionStorage.getItem('pos_session_ok') === '1'){
    render();
  } else {
    loginScreen();
  }
  if(huboCambios){
    render();
    toast('☁️ Datos sincronizados desde la nube');
  }
  escucharCambiosNube();
})();
</script>
